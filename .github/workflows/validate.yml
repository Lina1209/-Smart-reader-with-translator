name: Validate Read & Translate

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF fixture test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install --disable-pip-version-check reportlab pypdf pillow fonttools
      - name: Generate and inspect real PDF fixtures
        run: python -m unittest discover -s tests -p 'test_pdf_real_fixtures.py' -v
      - name: Audit PDF text-state operators
        run: python -m unittest discover -s tests -p 'test_pdf_content_stream_audit.py' -v
      - name: Audit PDF font resource mappings
        run: python -m unittest discover -s tests -p 'test_pdf_font_resource_audit.py' -v
      - name: Audit PDF Encoding CMaps
        run: python -m unittest discover -s tests -p 'test_pdf_encoding_cmap.py' -v
      - name: Inspect embedded TrueType glyph outlines
        run: python -m unittest discover -s tests -p 'test_pdf_truetype_glyph_audit.py' -v
      - name: Test joined PDF character mapping chain
        run: python -m unittest discover -s tests -p 'test_pdf_character_mapping_audit.py' -v
      - name: Check PDF text and obstacle rectangle intersections
        run: python -m unittest discover -s tests -p 'test_pdf_layout_overlap.py' -v
      - name: Traverse nested PDF Form XObjects and extract image placements
        run: python -m unittest discover -s tests -p 'test_pdf_image_placement.py' -v
      - name: Compare PDF text geometry with image placements
        run: python -m unittest discover -s tests -p 'test_pdf_text_image_overlap.py' -v
      - name: Audit PDF text grouping and reading-order heuristics
        run: python -m unittest discover -s tests -p 'test_pdf_reading_order_audit.py' -v
      - name: Render PDF fixtures and compare no-op round-trip pixels
        run: python -m unittest discover -s tests -p 'test_pdf_render_regression.py' -v
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.capture = "src" not in dict(attrs)
                      self.current = []
              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.parts.append("".join(self.current))
                      self.capture = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.parts:
              raise SystemExit("No inline application script found")
          for i, source in enumerate(parser.parts):
              Path(f"/tmp/readtranslate-{i}.js").write_text(source, encoding="utf-8")
          print(f"Extracted {len(parser.parts)} inline script(s)")
          PY
          for file in /tmp/readtranslate-*.js; do node --check "$file"; done
          node --check tts.js
      - name: Test translation chunk boundaries and Unicode preservation
        run: node tests/translation-chunks.test.cjs
      - name: Test reader file-open cancellation and stale requests
        run: node tests/open-file-cancellation.test.cjs
      - name: Test PDF OCR text extraction separators
        run: node tests/pdf-text-extraction-separators.test.cjs
      - name: Test mixed scanned and text PDF classification
        run: node tests/pdf-mixed-page-classification.test.cjs
      - name: Test EPUB extraction integrity
        run: node tests/epub-extraction-integrity.test.cjs
      - name: Test EPUB nested table of contents navigation
        run: node tests/epub-navigation-toc.test.cjs
      - name: Test EPUB reading position persistence
        run: node tests/epub-position-storage.test.cjs
      - name: Test EPUB dependency loader concurrency and retries
        run: node tests/epub-library-loader.test.cjs
      - name: Test generated document archive integrity and MIME types
        run: node tests/document-export-integrity.test.cjs
      - name: Test fixed-page reader pagination and long-token wrapping
        run: node tests/reader-pagination.test.cjs
      - name: Test glossary protection and retry classification
        run: node tests/translation-quality.test.cjs
      - name: Test PDF rewrite preflight safety gate
        run: node tests/pdf-rewrite-preflight.test.cjs
      - name: Test PDF.js text geometry
        run: node tests/pdf-text-geometry.test.cjs
      - name: Test PDF page navigation concurrency and cleanup
        run: node tests/pdf-page-navigation.test.cjs
      - name: Test PDF preview resource cleanup lifecycle
        run: node tests/pdf-preview-lifecycle.test.cjs
      - name: Check HTML IDs and referenced elements
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = [key for key, count in Counter(ids).items() if count > 1]
          refs = set(re.findall(r"""\$\(['"]([^'"]+)['"]\)""", html))
          missing = sorted(refs - set(ids))
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if missing:
              raise SystemExit("Missing elements referenced by $(): " + ", ".join(missing))
          print(f"Markup check passed: {len(ids)} IDs, {len(refs)} selector references")
          PY
